services:
  memoza_vpn:
    image: qmcgaw/gluetun:latest
    container_name: memoza_vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Poland}
      FIREWALL: "on"
      DOT: "on"
      TZ: Europe/Warsaw
    restart: unless-stopped

  # Placeholder worker. It shares the VPN container network, so all outbound
  # traffic exits via Proton once memoza_vpn is healthy.
  social_worker:
    image: alpine:3.20
    container_name: memoza_social_worker
    network_mode: "service:memoza_vpn"
    depends_on:
      - memoza_vpn
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    restart: unless-stopped
